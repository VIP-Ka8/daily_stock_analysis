name: 022455基金14点20定投分析

on:
  workflow_dispatch:

  schedule:
    # UTC 06:20 = 北京时间 14:20
    - cron: "20 6 * * 1-5"

jobs:
  fund-analysis:

    runs-on: ubuntu-latest

    steps:

      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行022455基金分析
        env:
          FUND_LIST: ${{ vars.FUND_LIST }}

          ANSPIRE_API_KEYS: ${{ secrets.ANSPIRE_API_KEYS }}

          ANSPIRE_LLM_BASE_URL: ${{ vars.ANSPIRE_LLM_BASE_URL }}

          ANSPIRE_LLM_MODEL: ${{ vars.ANSPIRE_LLM_MODEL }}

          SERVERCHAN3_SENDKEY: ${{ secrets.SERVERCHAN3_SENDKEY }}

        run: |
          python fund_analysis.py
